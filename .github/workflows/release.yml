name: Publish release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v0.3.27
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Verify and publish the signed 0.3.27 APK
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          commit = os.environ["COMMIT_SHA"]
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com/repos/" + repo
          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "DouyinScape-release",
          }

          def request(url, method="GET", data=None, content_type="application/json"):
              h = dict(headers)
              h["Content-Type"] = content_type
              if isinstance(data, dict):
                  data = json.dumps(data, ensure_ascii=False).encode("utf-8")
              with urllib.request.urlopen(urllib.request.Request(url, data=data, headers=h, method=method), timeout=60) as response:
                  return json.load(response)

          raw = "https://raw.githubusercontent.com/" + repo + "/" + commit + "/downloads/"
          name = "DouyinScape-0.3.27.apk"
          with urllib.request.urlopen(raw + name, timeout=60) as response:
              apk = response.read()
          with urllib.request.urlopen(raw + "SHA256SUMS", timeout=60) as response:
              sums = response.read()
          digest = hashlib.sha256(apk).hexdigest()
          expected = "c53ff809ddca63a0cb3ea5371d2be32c87e84860b1d462229592d294d07df658"
          assert digest == expected, "Signed APK digest differs from the verified build"
          assert sums.decode().split()[0] == digest, "Checksum file mismatch"

          body = """# 抖境 · DouyinScape 0.3.27
          
          本次汇总 0.3.19 至最终版的优化：
          
          - 优化聊天回复框的深色主题与布局，修复推荐表情被遮挡。
          - 优化视频放大播放、搜索、历史和稍后再看页面的沉浸与底栏避让，改善入场衔接。
          - 优化直播入场沉浸，以及横向、竖向商品卡片与聊天栏的避让。
          - 优化抖音月付与订单待使用页面，复用相同容器规则，减少重复适配。
          
          验证基线：抖音 40.8.0、OnePlus 15 / Android 17；其他机型及远端页面变体仍需验证。
          同签名旧版可覆盖安装，更新后重新打开抖音。
          """
          try:
              release = request(api + "/releases/tags/v0.3.27")
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              release = request(api + "/releases", "POST", {
                  "tag_name": "v0.3.27",
                  "target_commitish": commit,
                  "name": "抖境 · DouyinScape 0.3.27",
                  "body": body,
                  "draft": False,
                  "prerelease": False,
                  "make_latest": "true",
              })

          assets = {asset["name"]: asset for asset in request(api + "/releases/" + str(release["id"]) + "/assets")}
          upload = release["upload_url"].split("{")[0]
          for filename, payload, mime in [
              (name, apk, "application/vnd.android.package-archive"),
              ("SHA256SUMS", sums, "text/plain"),
          ]:
              if filename in assets:
                  existing = assets[filename]
                  assert existing["size"] == len(payload), "Existing asset size mismatch"
                  with urllib.request.urlopen(existing["browser_download_url"], timeout=60) as response:
                      assert hashlib.sha256(response.read()).digest() == hashlib.sha256(payload).digest(), "Existing asset content mismatch"
                  continue
              request(upload + "?name=" + urllib.parse.quote(filename), "POST", payload, mime)
          final = request(api + "/releases/" + str(release["id"]) + "/assets")
          assert {name, "SHA256SUMS"}.issubset({a["name"] for a in final})
          print(release["html_url"])
          print("Verified signed APK SHA-256:", digest)
          PY
